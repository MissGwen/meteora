<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="layerShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sunGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFAA00;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E5BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C7BD6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C7BD6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA8E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC4F0;stop-opacity:1" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky1)"/>

    <path d="M-50 500 Q180 320 420 360 Q650 390 820 280 Q1000 190 1074 260 L1074 1024 L-50 1024 Z" fill="url(#sky2)" filter="url(#layerShadow)"/>

    <path d="M-50 680 Q180 580 380 620 Q580 660 760 570 Q940 490 1074 580 L1074 1024 L-50 1024 Z" fill="url(#sky3)" filter="url(#layerShadow)"/>

    <g filter="url(#layerShadow)">
      <circle cx="350" cy="490" r="185" fill="url(#sunGrad)"/>
    </g>

    <g fill="#FFFFFF" filter="url(#layerShadow)">
      <circle cx="140" cy="750" r="110"/>
      <circle cx="310" cy="715" r="145"/>
      <circle cx="500" cy="750" r="125"/>
      <circle cx="680" cy="720" r="155"/>
      <circle cx="860" cy="755" r="125"/>
      <circle cx="980" cy="725" r="100"/>
      <rect x="20" y="730" width="1000" height="320" rx="100"/>
    </g>

    <g fill="#F0F6FF" opacity="0.7">
      <circle cx="260" cy="675" r="42"/>
      <circle cx="620" cy="670" r="40"/>
      <circle cx="820" cy="695" r="32"/>
    </g>
  </g>
</svg>
